version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mss-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: mss_session
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  session-server:
    build: .
    container_name: go-session-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6379:6379"
    volumes:
      - ./config.conf:/config.conf:ro
      - ./certs:/certs
    environment:
      - AUTH_PASSWORD=change-me-strong-password
      - TLS_ENABLED=false
      - DB_ENABLED=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - MSS_DB_NAME=sessions
      - MSS_DB_USER=postgres
      - MSS_DB_PASSWORD=12345
      - DB_SSLMODE=disable
      - DB_QUEUE_DEPTH=4096
      # Override defaults without touching config.conf:
      # - SESSION_DEFAULT_TTL=15m
      # - SESSION_MAX_TTL=24h
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"

  # Optional: Spring Boot app that connects to the session server
  # spring-app:
  #   image: your-spring-app:latest
  #   depends_on:
  #     - session-server
  #   environment:
  #     - SPRING_DATA_REDIS_HOST=session-server
  #     - SPRING_DATA_REDIS_PORT=6379
  #     - SPRING_DATA_REDIS_PASSWORD=change-me-strong-password

volumes:
  postgres_data:
