# ═══════════════════════════════════════════════════════════════
#  Spring Boot — Session Configuration for Go Session Server
#  The Go server speaks full RESP protocol, so just point
#  Spring's Redis client at it.
# ═══════════════════════════════════════════════════════════════

# ── Connection ────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=change-me-strong-password

# Enable TLS if your Go server has TLS enabled:
# spring.data.redis.ssl.enabled=true

# ── Session ───────────────────────────────────────────────────
spring.session.store-type=redis

# THIS IS THE KEY SETTING:
# Spring Boot will send SET <key> <value> EX <seconds> to the Go server.
# The Go server will use this TTL directly for that session key.
# Go server's default_ttl is only used if Spring sends SET without EX.
spring.session.timeout=30m

# Flush mode: immediate writes every attribute change
# (use on_save for better performance with fewer writes)
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session

# ── Redis Connection Pool ─────────────────────────────────────
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms

# ── How TTL flows from Spring Boot → Go Session Server ────────
#
#  1. spring.session.timeout=30m
#     └─► Spring sets: SET spring:session:sessions:<id> <data> EX 1800
#         Go server stores the key with TTL = 1800s (exactly as requested)
#
#  2. spring.session.timeout=0  (no timeout in Spring)
#     └─► Spring sets: SET spring:session:sessions:<id> <data>  (no EX)
#         Go server applies its own default_ttl from config.yaml
#
#  3. Go server max_ttl=24h caps any TTL Spring requests above 24h
#
#  So: Spring controls per-session TTL, Go server provides the safety net.
# ──────────────────────────────────────────────────────────────

# ── Optional: per-environment TTL overrides ───────────────────
# Development (short TTL for fast testing)
# spring.session.timeout=5m

# Production (longer sessions)
# spring.session.timeout=2h
